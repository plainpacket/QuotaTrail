name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tagged source and release notes
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${REQUESTED_TAG}^{commit}")"
          VERSION="${REQUESTED_TAG#v}"
          test -f "docs/releases/${VERSION}.md"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify unit tests and lint before signing
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ steps.version.outputs.version }}
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/quotatrail-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Assemble signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8"
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature and generate checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK="quotatrail-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          # Keep the public signing identity used for 1.0.0 so existing installs can update.
          grep -Eq '^(Signer #[0-9]+|V[0-9.]+ Signer): certificate SHA-256 digest: f81efcfde5c2cba3e7d2c45a307f2f308a60595b5aa86eed42c483fab288ed58$' signature.txt
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/aapt" dump badging "$APK" > apk-metadata.txt
          grep -Fq "package: name='app.quotatrail'" apk-metadata.txt
          grep -Fq "versionName='${VERSION}'" apk-metadata.txt
          sha256sum "$APK" > "${APK}.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QuotaTrail ${{ steps.version.outputs.version }}
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
          files: |
            quotatrail-${{ steps.version.outputs.version }}.apk
            quotatrail-${{ steps.version.outputs.version }}.apk.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Remove temporary signing key
        if: always()
        run: |
          if [[ -n "${KEYSTORE_PATH:-}" && "$KEYSTORE_PATH" == "${RUNNER_TEMP}/quotatrail-release.jks" ]]; then
            rm -f -- "$KEYSTORE_PATH"
          fi
